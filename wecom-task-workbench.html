<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>企微执行链路优化</title>
<style>
/* 公共视觉基准。按需使用组件，不代表需要在页面加入对应功能。 */
:root {
  --cdp-primary:#165dff; --cdp-primary-soft:#e8f3ff;
  --cdp-text:#303133; --cdp-secondary:#606b7b; --cdp-muted:#98a2b1;
  --cdp-page:#f5f7fc; --cdp-field:#f2f3f5; --cdp-border:#ebeef5;
  --cdp-danger:#f53f3f; --cdp-success:#00b42a;
  --cdp-font:14px; --cdp-small:12px; --cdp-title:16px;
  --cdp-control:32px; --cdp-radius:2px;
  --cdp-space-1:8px; --cdp-space-2:16px; --cdp-space-3:24px;
}
*{box-sizing:border-box}
body{margin:0;color:var(--cdp-text);background:var(--cdp-page);font:var(--cdp-font)/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--cdp-primary);outline-offset:2px}
[hidden]{display:none!important}
.cdp-workspace{padding:16px;min-width:0}
.cdp-panel{background:white;padding:16px;min-width:0}
.cdp-split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px}
.cdp-sidebar{background:white;border-right:1px solid var(--cdp-border)}
.cdp-nav-item{padding:12px 16px;color:var(--cdp-secondary)}
.cdp-nav-item.is-active{color:var(--cdp-primary);background:var(--cdp-field)}
.cdp-tabs{display:flex;gap:32px;border-bottom:1px solid var(--cdp-border);margin-bottom:16px}
.cdp-tab{position:relative;border:0;background:none;padding:0 0 12px;color:var(--cdp-secondary)}
.cdp-tab[aria-selected=true]{color:var(--cdp-primary);font-weight:500}
.cdp-tab[aria-selected=true]::after{content:"";height:2px;background:var(--cdp-primary);position:absolute;inset:auto 0 -1px}
.cdp-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 24px;padding:0 0 16px;border-bottom:1px solid var(--cdp-border)}
.cdp-field{display:flex;gap:16px;align-items:center;min-width:0}
.cdp-label{flex:0 0 96px;text-align:right;color:var(--cdp-secondary)}
.cdp-required::before{content:"* ";color:var(--cdp-danger)}
.cdp-control{height:var(--cdp-control);min-width:0;width:100%;background:var(--cdp-field);border:1px solid transparent;border-radius:var(--cdp-radius);padding:5px 12px;color:var(--cdp-text)}
.cdp-control::placeholder{color:var(--cdp-muted)}
.cdp-control:focus{outline:none;border-color:var(--cdp-primary)}
.cdp-control:focus-visible{outline:2px solid var(--cdp-primary);outline-offset:1px}
.cdp-control:disabled{color:var(--cdp-muted);cursor:not-allowed}
textarea.cdp-control{height:96px;resize:vertical;padding-bottom:20px}
.cdp-counted{position:relative;flex:1;min-width:0}
.cdp-counted input{padding-right:64px}
.cdp-count{position:absolute;right:12px;bottom:7px;color:var(--cdp-muted);font-size:var(--cdp-small);pointer-events:none}
.cdp-form{display:grid;gap:24px}
.cdp-form .cdp-field{align-items:flex-start}
.cdp-form .cdp-label{padding-top:5px}
.cdp-options{display:flex;align-items:center;flex-wrap:wrap;gap:24px;min-height:32px}
.cdp-options label{display:inline-flex;align-items:center;gap:8px}
input[type=radio],input[type=checkbox]{accent-color:var(--cdp-primary)}
.cdp-button{height:32px;padding:0 16px;border:1px solid var(--cdp-border);border-radius:var(--cdp-radius);background:white;color:var(--cdp-secondary);white-space:nowrap}
.cdp-button--primary{color:white;background:var(--cdp-primary);border-color:var(--cdp-primary)}
.cdp-button--plain{color:var(--cdp-primary);border-color:var(--cdp-primary)}
.cdp-button--muted{background:var(--cdp-field);border-color:var(--cdp-field)}
.cdp-button:disabled{opacity:.4}
.cdp-link{border:0;background:none;padding:0;color:var(--cdp-primary);text-decoration:none}
.cdp-link:disabled{opacity:.35}
.cdp-toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:12px 0}
.cdp-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.cdp-table-wrap{overflow:auto;border:1px solid var(--cdp-border);border-radius:4px}
.cdp-table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}
.cdp-table th{background:var(--cdp-field);font-weight:600}
.cdp-table th,.cdp-table td{height:40px;padding:8px 16px;border-right:1px solid var(--cdp-border);border-bottom:1px solid var(--cdp-border)}
.cdp-table tr:last-child td{border-bottom:0}
.cdp-table th:last-child,.cdp-table td:last-child{border-right:0}
.cdp-table .cdp-sticky-actions{position:sticky;right:0;background:white;box-shadow:-5px 0 8px #00000008}
.cdp-table th.cdp-sticky-actions{background:var(--cdp-field)}
.cdp-ellipsis{display:block;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cdp-pagination{display:flex;align-items:center;justify-content:flex-end;gap:16px;padding-top:12px}
.cdp-pagination [aria-current=page]{background:var(--cdp-primary-soft);color:var(--cdp-primary)}
.cdp-overlay{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center}
.cdp-drawer{position:absolute;right:0;top:0;bottom:0;width:60vw;max-width:100vw;background:white;display:flex;flex-direction:column;min-width:0}
.cdp-dialog{width:480px;max-width:calc(100vw - 32px);max-height:calc(100vh - 32px);background:white;border-radius:4px;display:flex;flex-direction:column}
.cdp-container-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border-bottom:1px solid var(--cdp-border);flex-shrink:0}
.cdp-container-title{font-size:var(--cdp-title);font-weight:600;margin:0}
.cdp-close{border:0;background:none;color:var(--cdp-secondary);font-size:20px;line-height:24px;padding:0 4px}
.cdp-container-body{padding:16px;overflow:auto;min-height:0;flex:1}
.cdp-container-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px;border-top:1px solid var(--cdp-border);flex-shrink:0;background:white}
.cdp-error{font-size:var(--cdp-small);color:var(--cdp-danger);margin-top:4px}
.cdp-help{font-size:var(--cdp-small);color:var(--cdp-muted)}
.cdp-control[aria-invalid=true]{border-color:var(--cdp-danger)}
.cdp-empty{padding:48px 16px;text-align:center;color:var(--cdp-muted)}
.cdp-tag{display:inline-block;font-size:12px;padding:2px 8px;color:var(--cdp-primary);background:var(--cdp-primary-soft);border-radius:2px}
:root{--ink:#202e41;--muted:#617086;--line:#e4eaf2;--blue:#165dff;--surface:#f5f7fa}
body{color:var(--ink);overflow:hidden}
h1,h2,h3,p,dl,dd{margin:0}
h1{font-size:22px;line-height:1.35;font-weight:650}
h2{font-size:16px;font-weight:650}
h3{font-size:14px;font-weight:650}
small,.sub{font-size:12px;color:var(--muted)}
svg{width:18px;height:18px;vertical-align:middle;flex:none}
button{color:inherit}
button:hover:not(:disabled){filter:brightness(.97)}
.icon-button{display:inline-grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:5px;width:32px;height:32px;color:#496078}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.between{justify-content:space-between}
.stack{display:grid;gap:12px}
.grow{flex:1;min-width:0}
.dim{color:var(--muted)}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.desktop{height:100vh;display:grid;grid-template-columns:208px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr)}
.brand{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid var(--line);padding:0 20px}
.logo{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;background:var(--blue);color:white}
.brand strong{font-size:15px}
.brand .divider{height:17px;border-left:1px solid var(--line);margin:0 6px}
.brand-meta{font-size:12px;color:var(--muted)}
.left{background:white;border-right:1px solid var(--line);padding:18px 12px 190px;overflow:auto}
.rail-title{font-size:11px;letter-spacing:.08em;font-weight:650;color:#6a798d;padding:0 9px;margin:0 0 11px}
.scene-panel{position:fixed;bottom:12px;left:12px;width:184px;z-index:110;padding:9px;background:#f4f7fc;border:1px solid #dce5f3;border-radius:5px}
.scene-panel .rail-title{padding:0 5px;margin:0 0 4px}
.rail-action{border:0;width:100%;text-align:left;background:transparent;display:flex;gap:7px;align-items:center;padding:7px 8px;border-radius:4px;font-size:12px;color:#435770}
.rail-action[aria-current=true]{background:#e6efff;color:#165dff;font-weight:650}
.main{min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.main-head{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:0 22px;flex:none}
.main-head h1{font-size:17px}
.scroll{overflow:auto;min-height:0}
.inbox-body{padding:24px;flex:1}
.feed{max-width:1080px;margin:auto}
.section-head{margin-bottom:15px;display:flex;align-items:baseline;gap:10px}
.section-head:not(:first-child){margin-top:26px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card h2{line-height:1.4}
.card .card-foot{border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.card .sub{line-height:1.6}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:9px 0;background:#f6f8fc;border-radius:4px}
.kpis>div{text-align:center;border-right:1px solid var(--line)}
.kpis>div:last-child{border:0}
.kpis strong{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.kpis small{font-size:11px}
.tag{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border-radius:3px;line-height:17px;white-space:nowrap;background:#edf1f6;color:#4c5e75}
.tag.blue{background:#eaf1ff;color:#1a55bd}
.tag.green{background:#e7f6ee;color:#19764d}
.tag.amber{background:#fff2dc;color:#935506}
.tag.red{background:#fdebec;color:#b02b36}
.avatar{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;flex:none;font-weight:650;background:#e6eefc;color:#345eaa}
.avatar.group{background:#e3f4ef;color:#16745b}
.conv{width:100%;background:white;border:0;text-align:left;padding:10px 8px;display:flex;align-items:center;gap:8px;border-radius:5px;margin-bottom:3px}
.conv[aria-current=true]{background:#e9f1ff}
.conv:disabled{opacity:.72}
.chat-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,374px);flex:1;min-height:0}
.chat{min-width:0;background:#edf2f7;display:flex;flex-direction:column;border-right:1px solid var(--line)}
.transcript{flex:1;padding:22px;display:flex;flex-direction:column;gap:17px}
.timestamp{align-self:center;color:#697a8e;font-size:12px;margin:0 0 5px}
.bubble-row{display:flex;gap:8px;align-items:flex-start}
.bubble-row.sent{justify-content:flex-end}
.bubble{background:white;border:1px solid #e1e8f2;border-radius:6px;padding:9px 12px;max-width:min(430px,77%);overflow-wrap:anywhere}
.sent .bubble{background:#e0edff;border-color:#d2e3ff}
.composer{height:97px;background:#fff;padding:10px 16px;border-top:1px solid var(--line);color:#647488}
.composer .icons{display:flex;gap:14px;margin-bottom:10px}
.side{background:#fff;display:flex;flex-direction:column;min-height:0}
.side-tabs{display:flex;border-bottom:1px solid var(--line);flex:none;padding:0 12px;gap:12px}
.side-tabs button{font-size:12px;white-space:nowrap;border:0;border-bottom:2px solid transparent;background:white;padding:12px 4px;color:var(--muted)}
.side-tabs button[aria-selected=true]{border-color:var(--blue);color:var(--blue);font-weight:650}
.side-body{flex:1;padding:14px}
.side-foot{border-top:1px solid var(--line);padding:10px 14px;background:#fff}
.side-foot button{width:100%}
.box{border:1px solid var(--line);border-radius:5px;background:white;padding:13px;min-width:0}
.summary-box{background:#f5f8ff;border-color:#e0eaff}
progress{width:100%;height:6px;display:block;border:0;appearance:none;border-radius:6px;overflow:hidden;background:#e1e8f4}
progress::-webkit-progress-bar{background:#e1e8f4}
progress::-webkit-progress-value{background:#2469ef}
progress::-moz-progress-bar{background:#2469ef}
.content-tile{border:1px solid var(--line);border-radius:4px;padding:10px;margin-top:8px;overflow-wrap:anywhere}
.attachment{display:flex;gap:8px;align-items:center;background:#f4f7fb;padding:8px;border-radius:4px}
.material-image{display:block;width:100%;height:62px;margin-top:5px;border-radius:3px;background:#e9f2ff;color:#1f56a0}
.notice{border-left:3px solid #3575ef;background:#f1f6ff;padding:8px 10px;font-size:12px;color:#324c70}
.notice.warn{border-color:#de9d2c;background:#fff7e7;color:#744a11}
summary{cursor:pointer;color:#293c56;font-weight:600}
.queue-item{padding:9px 0;border-top:1px solid var(--line)}
.record{border-top:1px solid var(--line);padding:9px 0}
.detail-wrap{padding:24px;flex:1}
.detail{max-width:820px;margin:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.detail-head{padding:20px 24px;border-bottom:1px solid var(--line)}
.detail-body{padding:20px 24px;display:grid;gap:18px}
.detail-foot{border-top:1px solid var(--line);padding:12px 24px}
.properties{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 20px}
.properties div{min-width:0}
.properties dt{font-size:12px;color:var(--muted);margin-bottom:4px}
.properties dd{white-space:pre-wrap;overflow-wrap:anywhere}
.properties .wide{grid-column:1/-1}
.result-table{width:100%;border-collapse:collapse}
.result-table td,.result-table th{text-align:left;border-bottom:1px solid var(--line);padding:9px}
.result-table th{background:#f4f6fa;font-size:12px}
.admin{flex:1;padding:16px;background:#f5f7fc}
.admin-body{min-height:100%;padding:16px;background:white}
.admin .cdp-table td,.admin .cdp-table th{padding:8px 10px}
.admin .cdp-table small{display:block}
.admin-crumb{color:var(--muted);font-size:12px}
.admin-list-title{padding-bottom:10px;border-bottom:1px solid var(--line);color:var(--blue)}
.admin-nav{padding:10px;border-radius:2px;font-size:13px;color:#536175}
.admin-nav.active{background:#f2f3f5;color:var(--blue);font-weight:600}
.cdp-drawer{width:min(780px,calc(100% - 212px))}
.cdp-drawer .cdp-container-body{padding:16px 22px}
.form-section{padding:0 0 15px;border-bottom:1px solid var(--line);margin-bottom:15px;display:grid;gap:10px}
.form-section h3{font-size:14px}
.form-field{display:grid;grid-template-columns:115px minmax(0,1fr);gap:12px;align-items:start}
.form-field>.field-label{font-size:13px;color:var(--muted);padding-top:6px;text-align:right}
.form-field textarea{height:66px}
.mode-options{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-options label{display:flex;align-items:flex-start;gap:6px;border:1px solid var(--line);border-radius:4px;padding:9px;cursor:pointer}
.mode-options label:has(input:checked){border-color:#78a4ff;background:#f5f8ff}
.mode-options small{display:block;margin-top:3px}
.switch-line{display:flex;align-items:center;gap:8px;padding-top:4px}
.preview-message{background:#f5f8fc;border:1px solid var(--line);padding:10px;white-space:pre-wrap;overflow-wrap:anywhere}
.toast{position:fixed;z-index:130;top:61px;left:50%;transform:translateX(-50%);background:#233751;color:white;padding:10px 16px;border-radius:5px;box-shadow:0 3px 15px #17253830;max-width:calc(100% - 32px)}
dialog{border:1px solid var(--line);padding:0;color:var(--ink);box-shadow:0 12px 48px #23375130}
dialog::backdrop{background:#16263b66}
@media(max-width:1110px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.desktop{grid-template-columns:182px minmax(0,1fr)}.scene-panel{width:158px}.cdp-drawer{width:min(760px,calc(100% - 186px))}}
@media(max-width:790px){.desktop{grid-template-columns:138px minmax(0,1fr)}.scene-panel{width:114px}.scene-panel svg{display:none}.chat-grid{grid-template-columns:minmax(150px,1fr) minmax(255px,50%)}.inbox-body,.detail-wrap{padding:12px}.cdp-drawer{width:calc(100% - 142px)}.form-field{grid-template-columns:88px minmax(0,1fr)}.mode-options{grid-template-columns:1fr}}
/* 企业微信桌面演示外壳 */
.desktop.wecom{grid-template: minmax(0,1fr) / 58px 248px minmax(0,1fr);color:#202328}
.wecom .main,.wecom .chat{background:#fff}
.wecom .main-head{height:58px;padding:0 19px;border-color:#ededee;color:#1d2024}
.wecom .left{padding:0;overflow:hidden;border-color:#ededee;display:flex;flex-direction:column}
.wecom .main-head h1{font-size:16px}
.wecom .conv-list{padding:4px 5px 250px;overflow:auto}
.wecom .conv{height:58px;margin:0;padding:8px 9px;gap:9px;border-radius:4px}
.wecom .conv small,.wecom .conv-time{color:#8a8c90;font-size:11px}
.wecom .conv[aria-current=true]{background:#4e90f5;color:white}
.wecom .conv[aria-current=true] small,.wecom .conv[aria-current=true] .conv-time{color:#e4efff}
.wecom .conv[aria-current=true] .wx-contact{color:#e1fff3}
.wecom .conv .avatar{width:37px;height:37px}
.wecom .conv strong{font-size:13px}
.wecom .conv-placeholder{cursor:default;opacity:1}
.wecom .conv-name{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wx-contact{color:#249257;font-weight:500;font-size:10px;margin-left:4px}
.wx-rail{background:#dce2eb;display:flex;align-items:center;flex-direction:column;gap:14px;padding:10px 0;color:#677587}
.wx-dots{display:flex;gap:4px}
.wx-dots i{width:8px;height:8px;border-radius:50%;background:#fa625b}
.wx-dots i:nth-child(2){background:#f6bc37}
.wx-dots i:nth-child(3){background:#27c447}
.wx-user{width:34px;height:34px;display:grid;place-items:center;background:#304665;color:white;border-radius:5px}
.wx-tool{width:44px;text-align:center;font-size:10px;line-height:1.5;padding:5px 0}
.wx-tool svg{display:block;margin:auto auto 3px}
.wx-tool.current{background:#c6daf6;color:#196bcc;border-radius:5px}
.wx-search{height:58px;flex:none;border-bottom:1px solid #f1f1f1;display:flex;align-items:center;gap:8px;padding:0 11px;color:#757b83}
.wx-search span{background:#f1f2f3;border-radius:5px;height:29px;display:flex;align-items:center;padding:0 9px;font-size:12px;gap:5px}
.wx-search svg{width:14px;height:14px}
.wx-search .wx-plus{font-size:17px;justify-content:center;width:29px}
.wx-app-avatar{background:#db302a;color:#fff;font-size:15px}
.wx-files-avatar{background:#22b84f;color:white}
.wx-team-avatar{background:#e9f3ff;color:#187bec}
.wx-news-avatar{background:#f6ae12;color:white}
.wx-avatar-wrap{position:relative;flex:none}
.wx-unread{position:absolute;right:-4px;top:-4px;background:#ed514d;color:white;border-radius:10px;padding:0 4px;font-size:9px;border:1px solid white;min-width:15px;text-align:center}
.wx-feed{flex:1;min-height:0;padding:14px 20px 22px;overflow:auto}
.wx-messages{width:min(402px,100%);margin:0 auto;display:grid;gap:13px}
.wx-message-time{text-align:center;color:#929498;font-size:11px}
.wx-message{border:1px solid #ececee;border-radius:5px;background:#fff;overflow:hidden;line-height:1.45}
.wx-message-body{padding:11px 15px 8px}
.wx-message h2{font-size:15px;color:#17191c;margin-bottom:2px}
.wx-message p{font-size:13px}
.wx-message-alert h2{margin-bottom:10px}
.wx-message-alert dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 5px;font-size:13px}
.wx-message-alert dt,.wx-message-alert dd{margin:0}
.wx-message-alert dd{overflow-wrap:anywhere}
.wx-message-alert dd span{display:block}
.wx-message-action{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;border-top:1px solid #eeeeef;background:#fff;padding:7px 15px;text-align:left;font-size:13px}
.wx-message-action:hover{background:#f3f7fd;color:#246bd0}
.wx-message-action svg{width:13px;height:13px;color:#7a818c}

function openSop(id, following=false) {
  const task = taskById(id);
  const pending = task.objects.filter((obj) => !finished(obj));
  const currentIndex = task.objects.findIndex((obj) => obj.id === state.contact);
  const ordered = following ? [...task.objects.slice(currentIndex+1), ...task.objects.slice(0,currentIndex+1)].filter((obj) => !finished(obj)) : pending;
  const inaccessible = [];
  const next = ordered.find((obj) => {
    if (obj.accessible) return true;
    obj.skipped = true;
    inaccessible.push(contacts[obj.id].name);
    return false;
  });
  const note = inaccessible.length ? `已跳过不可访问的会话：${inaccessible.join('、')}。相关对象仍未完成。` : '';
  if (next) {
    if(following) enterObject(task,next.id,note);
    else openConversationFromNotice(task,next.id,note);
  }
  else showResult(task, pending.length ? '当前没有可访问的待执行会话。' : '');
}

const demoClockStarted=Date.now();
function taskClockNow() {
  return demoNow.getTime()+Date.now()-demoClockStarted;
}
function deadlineText(due) {
  if(!Number.isFinite(due)) return '无时限';
  const seconds=Math.floor((due-taskClockNow())/1000);
  if(seconds<=0) return '已超时';
  const pad=n=>String(n).padStart(2,'0');
  return Math.floor(seconds/86400)+'天 '+pad(Math.floor(seconds/3600)%24)+':'+pad(Math.floor(seconds/60)%60)+':'+pad(seconds%60);
}

function otherTodoObjects(entries) {
  const groups=new Map();
  for(const entry of entries) {
    if(!entry.accessible||entry.id===state.contact) continue;
    if(!groups.has(entry.id)) groups.set(entry.id,{id:entry.id,entries:[],due:Infinity,priority:0});
    const group=groups.get(entry.id);
    group.entries.push(entry);
    group.due=Math.min(group.due,entry.due);
    group.priority=Math.max(group.priority,entry.priority);
  }
  return [...groups.values()].sort((a,b)=>
    Number(b.due<demoNow)-Number(a.due<demoNow) || a.due-b.due || b.priority-a.priority ||
    b.entries.length-a.entries.length || contacts[a.id].name.localeCompare(contacts[b.id].name,'zh-CN')

  return `<textarea id="${name}" name="${name}" class="cdp-control" ${attrs}>${esc(value)}</textarea>`;
}
function switchField(name,checked,label) {
  return `<label class="switch-line" for="${name}"><input type="checkbox" role="switch" id="${name}" name="${name}" ${checked?'checked':''}>${label}</label>`;
}
function selectField(name,list,value,attrs='') {
  return `<select id="${name}" name="${name}" class="cdp-control" ${attrs}>${list.map(([id,label])=>`<option value="${esc(id)}" ${id===value?'selected':''}>${esc(label)}</option>`).join('')}</select>`;
}
const targets = Object.entries(contacts).filter(([id])=>id!=='wm-lu');
function targetOptions(kind) {

function openPlan(id) {

      ${field('处理期限','hasDue',switchField('hasDue',p.hasDue,'设置处理期限'))}
      <div class="stack" id="due-fields">
      ${field('触发后时限','hours',input('hours',p.hours??24,'type="number" required min="1" step="1" aria-describedby="hours-label"')+'<small id="hours-label">单位：小时</small>',true)}
      ${field('超期提醒','nudge',switchField('nudge',p.nudge,'处理超期时提醒员工'))}

  </form></div>`;
  updatePlan();
  $('plan-form').addEventListener('input',event=>{
    if(event.target.id==='kind') {
      $('target').replaceChildren(...targetOptions($('kind').value).map(([id,label])=>new Option(label,id)));
    }
    updatePlan();
  });
  $('plan-form').addEventListener('submit',savePlan);
}
function updatePlan() {
  const form = $('plan-form');
  const notify = form.elements.mode.value==='notice';
  const toggle = (id,visible) => {
    const group = $(id);
    group.hidden = !visible;
    group.querySelectorAll('input,textarea').forEach(control=>{control.disabled=!visible;});
  };
  toggle('notice-fields',notify);
  toggle('handle-fields',!notify);
  toggle('due-fields',!notify && $('hasDue').checked);
  $('message-preview').textContent = ($('title').value.trim() || '预警名称') + '\n' +
    contacts[$('target').value].name + '\n' + ($('message').value.trim() || '通知内容') + '\n查看详情';
}
function requireText(input) {
  if(input.value.trim()) return true;
  input.setCustomValidity('请填写此项');
  input.reportValidity();
  input.setCustomValidity('');
  return false;
}
function savePlan(event) {
  event.preventDefault();
  const form = event.currentTarget, mode=form.elements.mode.value;
  const get = (id) => $(id).value.trim();
  const fields = ['title','condition',...(mode==='notice'?['notifyStaff','message']:['handleStaff','requirement'])];
  if (!fields.every(id=>requireText($(id)))) return;
  const data = {id:state.draft.id||'plan-'+(plans.length+1),title:get('title'),kind:get('kind'),target:get('target'),condition:get('condition'),mode};
  if (mode==='notice') Object.assign(data,{staff:get('notifyStaff'),message:get('message'),ack:$('ack').checked,advice:get('advice')});
  else {
    const hasDue=$('hasDue').checked;
    Object.assign(data,{staff:get('handleStaff'),requirement:get('requirement'),hasDue,hours:hasDue?Number(get('hours')):null,nudge:hasDue&&$('nudge').checked,resultRequired:$('resultRequired').checked});
  }
  const index=plans.findIndex(p=>p.id===data.id);
  if (index===-1) plans.unshift(data);
  else plans[index]=data;
  go('plans');
  feedback('预警计划已保存');
}
function triggerPlan(id) {
  const plan=plans.find(p=>p.id===id);
  const a=eventFromPlan(plan,'a-demo-'+alerts.length,demoNow,{actual:plan.condition,data:'模拟命中 1 次'});
  alerts.push(a);
  go('alert-inbox');
  app.querySelector('#alert-feed').scrollIntoView({block:'start'});
  feedback('已生成模拟预警通知');
}
function openDialog(title,body,foot) {
  $('dialog').innerHTML=`<header class="cdp-container-head"><h2>${title}</h2><button type="button" data-action="close-dialog" class="cdp-close" aria-label="关闭">×</button></header><div class="cdp-container-body">${body}</div><footer class="cdp-container-foot">${foot}</footer>`;
  $('dialog').showModal();
}
function handleAction(status,id=state.alert) {
  const a=alertById(id);
  if(!a||!isOpen(a)) return;
  if (status==='doing') {
    if (a.status==='pending') {
      a.status=status;
      a.logs.push({time:stamp,text:'标记处理中',note:''});
      render();
      feedback('已标记处理中');
    }
    return;
  }
  const resolved=status==='done', required=!resolved||a.resultRequired;
  openDialog(resolved?'标记已处理':'标记无需处理',
    `<form id="handle-form" class="stack">
      ${resolved?field('处理方式','resolution',selectField('resolution',[['','请选择'],['电话联系','电话联系'],['线下跟进','线下跟进'],['企微联系','企微联系'],['其他','其他']],'','required'),true):''}
      ${field(resolved?'处理结果':'无需处理原因','resolutionNote',textArea('resolutionNote','','placeholder="填写处理说明"'+(required?' required':'')),required)}
    </form>`,btn('取消','close-dialog')+'<button class="cdp-button cdp-button--primary" type="submit" form="handle-form">提交</button>');
  $('handle-form').addEventListener('submit',event=>{
    event.preventDefault();
    if(required && !requireText($('resolutionNote'))) return;
    if(!isOpen(a)) return $('dialog').close();
    a.status=status;
    a.closedAt=demoNow;
    a.logs.push({time:stamp,text:resolved?'已处理 · '+$('resolution').value:'无需处理',note:$('resolutionNote').value.trim()});
    $('dialog').close();
    render();
    feedback(resolved?'处理结果已记录':'已标记无需处理');
  });
}


const sopScenes = [
  ['inbox','SOP通知','bell'],
  ['single','客户SOP','person'],
  ['group','群SOP','list'],
  ['customer-alert','客户预警','bell'],
  ['group-alert','群预警','bell'],
  ['continuous','多客户连续执行','chat'],
  ['empty-chat','无待办会话','chat'],
  ['current-only','仅当前有待办','person'],
];
const alertScenes = sopScenes;
function render(keepScroll=false) {
  if(state.view==='opening') {
    app.innerHTML=`<div class="desktop wecom">${wxRail()}${wxList()}<main class="main">${inbox()}</main></div>`+openingView();
    $('scenes').classList.add('wecom-scenes');
    $('scenes').innerHTML='<div class="rail-title">原型场景</div>'+sopScenes.map(([id,label,symbol])=>`<button type="button" class="rail-action" data-action="scene" data-id="${id}">${icon(symbol)}${label}</button>`).join('');
    return;
  }
  const scroll = keepScroll ? [...app.querySelectorAll('[data-scroll]')].map(e=>[e.dataset.scroll,e.scrollTop]) : [];
  const task=selectedTask();
  const wecom=['messages','inbox'].includes(state.view) ||
    (state.view==='chat' && state.wecomChat) || (state.view==='result' && task?.type.endsWith('SOP'));
  const views={messages,inbox,'alert-inbox':alertInbox,chat:wecom?wxChatView:chatView,result:resultView,alert:alertView,plans:planList};
  const admin=state.view==='plans';
  const current=state.activeScene??'inbox';
  app.innerHTML=`<div class="desktop${wecom?' wecom':''}">
    ${wecom?wxRail()+wxList():`<header class="brand"><div class="row"><span class="logo">${icon(admin?'grid':'chat')}</span><strong>${admin?'CDP 客户营销系统':'企业微信'}</strong><span class="divider"></span><span class="brand-meta">${admin?'运营管理':'CDP 任务通知'}</span></div><span class="brand-meta">${admin?'管理端':'员工端'}</span></header>
    <aside class="left">${sidebar()}</aside>`}
    <main class="main">${views[state.view]()}</main>
    </div>`;
  $('scenes').classList.toggle('wecom-scenes',wecom);
  $('scenes').innerHTML='<div class="rail-title">原型场景</div>'+(wecom?sopScenes:alertScenes).map(([id,label,symbol])=>`<button type="button" class="rail-action" data-action="scene" data-id="${id}" aria-current="${id===current}">${icon(symbol)}${label}</button>`).join('');
  for(const [key,value] of scroll) {
    const element=app.querySelector('[data-scroll="'+key+'"]');
    if(element) element.scrollTop=value;
  }
  const transcript=app.querySelector('[data-scroll="chat"]');
  if(transcript) transcript.scrollTop=transcript.scrollHeight;
}
function scene(id) {
  if($('dialog').open) $('dialog').close();
  state.demoEmpty=id==='empty-chat';
  state.demoCurrentOnly=id==='current-only';
  state.activeScene=id==='employee-todos'?'continuous':sopScenes.some(([key])=>key===id)?id:'inbox';
  if(id==='single') return enterObject(taskById('single'),'wm-xu','',true);
  if(id==='group') return enterObject(taskById('group'),'wr-manchester','',true);
  if(id==='continuous') return enterObject(taskById('multi'),'wm-shen','',true);
  if(id==='employee-todos') return enterObject(taskById('multi'),'wm-shen','',true);
  if(id==='customer-alert'||id==='group-alert') {
    const alert=alertById(id==='customer-alert'?'a-intent':'a-send');
    enterObject(null,alert.target,'',true);
    state.expandedTodo=alert.id;
    render();
    return;
  }
  if(id==='empty-chat') return enterObject(null,'wm-su','',true);
  if(id==='current-only') return enterObject(taskById('single'),'wm-xu','',true);
  if(id==='reminder' || id==='handling') return openAlert(id==='reminder'?'a-quiet':'a-intent');
  if(id==='result') return showResult(taskById('complete'));
  if(id==='config') {
    go('plans');
    return openPlan('');
  }
  if(id==='messages'||id==='plans'||id==='alert-inbox') return go(id);
  state.sopRead=true;
  go('inbox');
}
function currentObject(task=selectedTask()) {
  return task?.objects.find(o=>o.id===state.contact);
}
function switchObject(id) {
  const task=selectedTask();
  const obj=task?.objects.find(o=>o.id===id);
  if(!obj || id===state.contact) return;
  if(!obj.accessible) {
    obj.skipped=true;
    state.note=`${contacts[id].name}的会话不可访问，已跳过，任务仍未完成。`;
    render(true);
    return;
  }
  enterObject(task,id);
}
const drafts=new Map();
const submitting=new Set();
function stagedMessages(id=state.contact) {
  return (drafts.get(id)??[]).filter(({item})=>item.state!=='sent');
}
function messageComposer() {
  const draft=stagedMessages();
  const busy=submitting.has(state.contact);
  return `<div class="wx-message-compose" aria-label="消息框">
    <div class="wx-draft-content scroll">${draft.length?draft.map(({item})=>`
      <div class="wx-draft-item">${preview(item)}</div>`).join(''):'<small>消息框</small>'}</div>
    ${draft.some(({item})=>item.state==='failed')?'<p class="cdp-error">发送失败，可再次点击发送。</p>':''}
    <div class="cdp-actions"><button type="button" class="cdp-button cdp-button--primary" data-action="submit-message" ${!draft.length||busy?'disabled':''}>${busy?'发送中…':'发送'}</button></div>
  </div>`;
}
function stageMessages(indexes,task=selectedTask()) {
  const obj=currentObject(task);
  if(!obj?.accessible||submitting.has(state.contact)) return;
  const draft=stagedMessages();
  const requested=indexes??obj.items.map((_,i)=>i);
  for(const index of requested) {
    const item=obj.items[index];
    if(item&&['pending','failed'].includes(item.state)&&!draft.some(entry=>entry.item===item)) draft.push({item,index,task});
  }
  if(!indexes) {
    const ordered=draft.filter(entry=>entry.task===task).sort((a,b)=>a.index-b.index);
    for(let i=0;i<draft.length;i++) {
      if(draft[i].task===task) draft[i]=ordered.shift();
    }
  }
  drafts.set(state.contact,draft);
  if(!indexes) state.expandedTodo=null;
  render(Boolean(indexes));
}
async function submitMessages() {
  const contact=state.contact, draft=stagedMessages(contact);
  if(!draft.length||submitting.has(contact)) return;
  submitting.add(contact);
  try {
    for(const {index,task} of draft) {
      if(state.view!=='chat'||state.contact!==contact) break;
      if(!await sendItems([index],task)) break;
    }
  } finally {
    const remaining=stagedMessages(contact);
    if(remaining.length) drafts.set(contact,remaining);
    else drafts.delete(contact);
    submitting.delete(contact);
    if(state.view==='chat'&&state.contact===contact) render(true);
  }
}
let sentOrder=0;
async function sendItems(indexes,task=selectedTask()) {
  const obj=currentObject(task), contact=state.contact, queue=selectedTask();
  const inConversation=()=>state.view==='chat'&&state.contact===contact;
  const inContext=()=>inConversation()&&selectedTask()===queue;
  if(!inContext() || !obj?.accessible || obj.sending) return;
  const selected=indexes?indexes.map(index=>obj.items[index]):obj.items;
  const items=selected.filter(i=>i && ['pending','failed'].includes(i.state));
  if(!items.length) return;
  obj.sending=true;
  let failed=false;
  for(const i of items) {
    if(!inContext()) break;
    i.state='sending';
    render(true);
    await new Promise(resolve=>setTimeout(resolve,280));
    failed=i.failOnce;
    i.failOnce=false;
    i.state=failed?'failed':'sent';
    if(!failed) {
      i.sentOrder=++sentOrder;
      i.sentAt=demoNow;
    }
    if(failed) break;
  }
  obj.sending=false;
  if(finished(obj)) {
    for(const alert of alerts.filter(a=>a.explicitTask===task.id&&a.target===contact&&isOpen(a))) {
      alert.status='done';
      alert.closedAt=demoNow;
      alert.logs.push({time:stamp,text:'已处理 · 企微联系',note:'已发送预警话术。'});
    }
  }
  if(state.draft) return;
  if(inConversation()) {
    render(true);
    const nextPrompt=app.querySelector('.wx-todo-empty');
    if(nextPrompt) nextPrompt.closest('[data-scroll]').scrollTop=0;
  } else if(state.view==='inbox' || (state.view==='result' && selectedTask()===task)) render();
  return !failed;
}
const actions = {
  scene, 'open-sop':openSop, 'open-alert':openAlert, switch:switchObject,
  'open-contact':id=>{
    if(state.view==='chat' && state.contact===id) return;
    const task=state.view==='chat'?selectedTask():null;
    enterObject(task?.objects.some(obj=>obj.id===id&&obj.accessible)?task:null,id);
  },
  'alert-phrase':id=>stageMessages(null,taskById(alertById(id).explicitTask)),
  'wx-alert':id=>{
    const alert=alertById(id);
    alert.viewed=true;
    openConversationFromNotice(null,alert.target);
  },
  'confirm-visit':id=>{
    const alert=alertById(id);

    state.followupFeedback='';

  'submit-visit':id=>{

    state.followupFeedback='';

  },
  'todo-alert':id=>openAlert(id,{task:selectedTask(),contact:state.contact}),
  'todo-return':()=>{

    if(source) enterObject(source.task,source.contact,'',true);
  },
  send:(index,taskId)=>stageMessages([Number(index)],taskById(taskId)),
  'send-all':taskId=>stageMessages(null,taskById(taskId)),
  'submit-message':submitMessages,
  'toggle-side':()=>{state.sideOpen=!state.sideOpen;render();},
  'more-current':()=>{state.currentLimit+=3;render(true);},
  'collapse-current':()=>{state.currentLimit=3;state.expandedTodo=null;render(true);},
  'more-summary':id=>{state.summaryLimits[id]=(state.summaryLimits[id]??3)+3;render(true);},
  'collapse-summary':id=>{state.summaryLimits[id]=3;render(true);},
  'more-objects':()=>{state.objectLimit+=3;render(true);},
  'collapse-objects':()=>{state.objectLimit=10;render(true);},
  'todo-tab':id=>{state.todoTab=id;render();},
  menu:tab=>{state.menu=tab;render();},
  next:id=>openSop(id,true), result:id=>showResult(taskById(id)),
  preview:(index,taskId)=>{
    const i=currentObject(taskById(taskId)).items[index];
    openDialog('内容预览',preview(i,true),btn('关闭','close-dialog'));
  },
  'close-dialog':()=>$('dialog').close(),
  'edit-plan':openPlan,
  'close-plan':()=>go('plans'),
  trigger:triggerPlan,
  'alert-chat':id=>openAlertChat(id),
  'alert-send':id=>openAlertChat(id,alertById(id).explicitTask),
  handle:handleAction,
  ack:id=>{
    const a=alertById(id);
    a.confirmed=true;
    render();
    feedback('已确认已阅');
  },
};
document.addEventListener('click',event=>{
  const button=event.target.closest('[data-action]');

document.addEventListener('input',event=>{

document.addEventListener('toggle',event=>{

document.addEventListener('keydown',event=>{
  if(event.key==='Escape' && state.draft && !$('dialog').open) go('plans');
});
scene(page || 'inbox');
setInterval(updateTaskTimes,1000);
