<script>

else if(channel==='广告位'&&step===1)html=`<div class="sectiontitle">地域限制与优先级</div>${row('地域限制','<select><option>无地域限制</option><option>伦敦</option><option>悉尼</option></select>')}${row('任务优先级',`<select data-common="priority">${['1','2','3'].map(v=>`<option ${s.priority===v?'selected':''}>${v}</option>`).join('')}</select><span class="muted">　演示约定：数字越小优先级越高</span>`,true)}<div class="note">对照组与实验组共用本任务优先级，图片版本不参与任务竞争。</div>`;

function content(){const s=st(),v=g();let h='';if(channel==='广告位')h+=row('投放时间',`<input type="datetime-local" data-common="start" value="${s.start}"> 至 <input type="datetime-local" data-common="end" value="${s.end}">`,true);else if(channel==='站内信'){h+=row('通知系统',`<select data-common="system"><option>小程序</option></select>`,true)+row('通知类型','<select><option>活动通知</option></select>',true)}
