    .type-tabs{height:48px;background:#fff;border-bottom:1px solid var(--line);display:flex;padding:0 16px;gap:30px}.type-tabs button{border:0;background:transparent;color:#4f5d72;padding:0 6px;font-size:15px}.type-tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600}.asset-note{background:#f0f6ff;border:1px solid #d9e6ff;color:#52627a;padding:10px 14px;font-size:13px}.detail-tabs{display:flex;border-bottom:1px solid var(--line);gap:28px;margin:-4px 0 18px}.detail-tabs button{border:0;background:transparent;padding:10px 2px;color:#526075}.detail-tabs button.active{color:var(--blue);border-bottom:2px solid var(--blue);font-weight:600}.summary-row{display:flex;gap:12px;margin-bottom:16px}.summary-box{flex:1;border:1px solid var(--line);padding:12px 14px}.summary-box .num{font-size:22px;font-weight:650;margin-top:4px}.modal-table th,.modal-table td{height:40px;font-size:12px;padding:0 9px}.modal-table .customer{color:var(--blue)}

    /* modal */
    .modal-mask{position:fixed;inset:0;background:rgba(20,27,38,.46);z-index:300;display:grid;place-items:center}.modal{width:720px;max-height:78vh;background:#fff;box-shadow:var(--shadow);border-radius:5px;display:flex;flex-direction:column}.modal.sm{width:560px}.modal-head{height:56px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:600}.modal-body{padding:18px 20px;overflow:auto}.modal-foot{height:62px;padding:0 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;align-items:center;gap:10px}.searchline{display:flex;gap:10px;margin-bottom:14px}.searchline input{flex:1;height:36px;border:1px solid var(--line2);padding:0 10px}.pick-list{border:1px solid var(--line)}.pick-row{display:grid;grid-template-columns:34px 1fr 110px 120px;align-items:center;min-height:54px;border-bottom:1px solid var(--line);padding:0 12px}.pick-row:last-child{border-bottom:0}.pick-row.selected{background:#f5f8ff}.fake-radio{width:15px;height:15px;border-radius:50%;border:1px solid #b9c3d1;position:relative}.selected .fake-radio{border-color:var(--blue)}.selected .fake-radio:after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--blue)}.name{font-weight:500}.small{font-size:12px;color:#7b8798}.divider{height:1px;background:var(--line);margin:16px 0}.form-block{margin-bottom:16px}.form-block label{display:block;color:#536074;margin-bottom:7px}.form-block input,.form-block textarea,.form-block select{width:100%;border:1px solid var(--line2);padding:9px 10px}.form-block textarea{height:74px;resize:none}.detail-grid{display:grid;grid-template-columns:110px 1fr;gap:13px 16px}.toast{position:fixed;z-index:500;top:26px;left:50%;transform:translateX(-50%);background:#263244;color:#fff;padding:10px 20px;border-radius:4px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
    @media(max-width:1050px){.app{grid-template-columns:190px 1fr}.task-drawer{width:calc(100vw - 80px)}.filters{grid-template-columns:1fr 1fr}.prototype-switch{top:auto;bottom:20px}.trigger-options{flex-direction:column}}

<body>

  <script>
    const tags=[
      {name:'私聊SOP-目标达成客户',desc:'客户在私聊SOP有效期内达到预设目标',group:'SOP结果标签',count:1268,task:6,activeTask:2,creator:'宋尚雯',createTime:'2026-08-12 10:18:32',opTime:'2026-08-30 16:20:18',dataTime:'2026-08-31 10:05:26',state:'启用'},
      {name:'私聊SOP-首次成功触达',desc:'客户在私聊SOP中首次被成功触达',group:'SOP结果标签',count:856,task:4,activeTask:1,creator:'单世权',createTime:'2026-08-15 09:26:17',opTime:'2026-08-29 11:08:32',dataTime:'2026-08-31 09:52:10',state:'启用'},
      {name:'预约唤醒成功客户',desc:'预约提醒类任务统一沉淀人群',group:'营销运营专用标签',count:3240,task:12,activeTask:3,creator:'陈晓宇',createTime:'2026-08-08 14:30:05',opTime:'2026-08-28 18:42:03',dataTime:'2026-08-31 09:48:42',state:'启用'},

    ];
    let selectedTag=null, trigger='', resultEnabled=false;
    const layer=document.getElementById('layer');
    function nav(mode){
      const sop=mode==='sop';
      document.getElementById('sideNav').innerHTML=sop?`
        <div class="nav-item"><span class="ico">⌂</span>首页</div><div class="nav-item"><span class="ico">◉</span>全域任务总览</div><div class="nav-item"><span class="ico">▥</span>分析</div><div class="nav-item"><span class="ico">♙</span>用户画像</div>
        <div class="nav-group"><div class="nav-item active nav-title"><span><span class="ico">☁</span>企微运营</span><span class="chev">⌃</span></div><div class="nav-sub active">SOP任务</div><div class="nav-sub">朋友圈任务</div><div class="nav-sub">群发工具</div></div>
        <div class="nav-item"><span class="ico">♧</span>预警中心</div><div class="nav-item"><span class="ico">▣</span>内容中心</div>`:`
        <div class="nav-item"><span class="ico">⌂</span>首页</div><div class="nav-item"><span class="ico">◉</span>全域任务总览</div><div class="nav-item"><span class="ico">▥</span>分析</div>

      nav('sop');document.getElementById('crumb').innerHTML='首页　/　企微运营　/　<strong>SOP任务</strong>';document.getElementById('pageTabs').innerHTML='<button>首页</button><button class="active">SOP任务</button>';

      document.getElementById('sopPage').innerHTML=`<div class="workspace"><div class="card"><div class="sop-tabs"><span>群SOP</span><span class="active">客户SOP</span></div><div class="notice">创建员工SOP规则，可根据不同类型的客户设定不同的任务，客户触发条件后自动进入任务。</div><div class="toolbar"><button class="btn primary">创建任务</button><button class="btn primary">数据分析</button></div><table><tr><th>任务名称</th><th>任务描述</th><th>任务类型</th><th>任务状态</th></tr><tr><td>校代B第三周第一次周一触达</td><td>筛选推荐成单客户...</td><td>定时任务</td><td>进行中</td></tr><tr><td>品牌UGC营销-已入住更新</td><td>-</td><td>实时任务</td><td>进行中</td></tr><tr><td>SDRE已预订校代招募7月</td><td>-</td><td>定时任务</td><td>已结束</td></tr></table></div></div><div class="shade"></div>${drawerHtml()}`;
      bindSop();
    }
    function drawerHtml(){return `<div class="task-drawer"><div class="drawer-head"><span>创建任务</span><button class="x">×</button></div><div class="drawer-body"><div class="form">
      <div class="sop-tabs" style="padding-left:0;margin-bottom:16px"><span>定时任务</span><span class="active">实时任务</span></div>
      <div class="notice" style="margin-bottom:16px">将不同触发规则的任务整合在一起，员工触发不同的规则，下发不同的任务。选择过生效时间后，请在生效开始时间之前完成任务创建。</div>
      <div class="form-row"><div class="form-label req">生效时间</div><div class="inline"><span class="radio on"><i></i>设置开始时间-结束时间</span><span class="radio"><i></i>立即生效</span><div class="input" style="width:390px">2026-08-31 11:53　　-　　2026-09-07 11:53　⌄</div></div></div>
      <div class="form-row"><div class="form-label req">目标设定</div><div><div class="inline"><span class="switch on"></span></div><div class="inline" style="margin-top:10px"><span class="muted">有效触达</span><span class="input" style="width:88px">48</span><span class="muted">小时内，客户发言条数 大于等于</span><span class="input" style="width:88px">1</span><span class="muted">条</span></div></div></div>
      <div class="form-row"><div class="form-label">结果标签<span class="help" title="开启后，在客户达到所选时机时自动添加标签">?</span></div><div class="result-section">
        <div class="result-head" style="margin-bottom:${resultEnabled?'14px':'0'}"><span class="switch ${resultEnabled?'on':''}" id="resultSwitch"></span></div>
        <div class="result-config ${resultEnabled?'':'hidden'}" id="resultConfig">
          <div class="sentence-config">当客户
            <select class="select" style="width:210px;background:#fff" id="triggerSelect"><option value="" ${trigger===''?'selected':''}>请选择打标时机</option><option value="touch" ${trigger==='touch'?'selected':''}>首次被成功触达</option><option value="goal" ${trigger==='goal'?'selected':''}>达成任务目标</option></select>
            时，自动添加
            <button class="inline-select ${selectedTag?'':'placeholder'}" id="pickTag">${selectedTag?selectedTag.name:'请选择结果标签'}</button>
            标签。
            <div class="tag-dropdown hidden" id="tagDropdown"><div class="tag-dropdown-head"><input placeholder="搜索结果标签"></div><div class="tag-dropdown-body">
              <div class="tree-row"><span class="arrow">▼</span><span class="folder">▢</span><strong>营销运营专用标签</strong><span class="tree-meta">${tags.length}</span></div>
              <div class="tree-row level-1"><span class="arrow">▼</span><span class="folder">▢</span><span>SOP结果标签</span><span class="tree-meta">${tags.length-1}</span></div>
              ${tags.slice(0,4).map(t=>`<div class="tree-row level-2 dropdown-tag ${selectedTag&&selectedTag.name===t.name?'selected':''}" data-name="${t.name}"><span class="leaf-radio"></span><span>${t.name}</span><span class="tree-meta">${t.count.toLocaleString()} 人</span></div>`).join('')}
              <div class="tree-row level-1"><span class="arrow">▼</span><span class="folder">▢</span><span>活动结果标签</span><span class="tree-meta">1</span></div>
              ${tags.slice(4).map(t=>`<div class="tree-row level-2 dropdown-tag ${selectedTag&&selectedTag.name===t.name?'selected':''}" data-name="${t.name}"><span class="leaf-radio"></span><span>${t.name}</span><span class="tree-meta">${t.count.toLocaleString()} 人</span></div>`).join('')}
            </div><div class="tag-dropdown-foot"><button id="dropdownNew">＋ 新建结果标签</button></div></div>
          </div>
        </div>
      </div></div>
      <div class="form-row"><div class="form-label">子任务</div><div><div style="display:flex;justify-content:flex-end;margin-bottom:10px"><button class="btn primary">新增子任务</button></div><div style="border:1px solid var(--line)"><div style="height:46px;background:#f3f5f8;display:flex;align-items:center;justify-content:space-between;padding:0 14px"><strong><span style="display:inline-grid;place-items:center;width:22px;height:22px;background:var(--blue);color:#fff;border-radius:50%;margin-right:8px">1</span>预约提醒</strong><span><button class="btn link">编辑</button><button class="btn link danger">删除</button></span></div><div style="padding:14px"><div class="detail-grid"><span class="muted">子任务名称</span><span>预约提醒</span><span class="muted">用户完成事件</span><span>小程序启动总次数大于等于 1 次</span><span class="muted">发送内容</span><span class="input">[文本] 您的预约即将开始，请及时查看</span></div></div></div></div></div>
      </div></div><div class="drawer-foot"><button class="btn">取消</button><button class="btn ghost-blue">上一步</button><button class="btn ghost-blue">保存草稿</button><button class="btn primary">保存并应用</button></div></div>`}
    function bindSop(){
      document.getElementById('resultSwitch').onclick=()=>{resultEnabled=!resultEnabled;renderSop()};
      const triggerSelect=document.getElementById('triggerSelect');if(triggerSelect)triggerSelect.onchange=e=>{trigger=e.target.value};
      const pickTag=document.getElementById('pickTag');if(pickTag)pickTag.onclick=()=>document.getElementById('tagDropdown').classList.toggle('hidden');
      const dropdownNew=document.getElementById('dropdownNew');if(dropdownNew)dropdownNew.onclick=e=>{e.stopPropagation();openCreateTag(true)};
      document.querySelectorAll('.dropdown-tag').forEach(x=>x.onclick=()=>{selectedTag=tags.find(t=>t.name===x.dataset.name);renderSop();toast('已选择结果标签')});
      const tagSearch=document.querySelector('.tag-dropdown-head input');if(tagSearch)tagSearch.oninput=e=>document.querySelectorAll('.dropdown-tag').forEach(x=>x.classList.toggle('hidden',!x.dataset.name.toLowerCase().includes(e.target.value.trim().toLowerCase())));
    }
    function renderAssets(){
      nav('asset');document.getElementById('crumb').innerHTML='首页　/　用户画像　/　标签中心　/　用户标签　/　<strong>标签列表</strong>';document.getElementById('pageTabs').innerHTML='<button>首页</button><button>SOP任务</button><button class="active">标签列表</button>';
      document.getElementById('sopPage').classList.add('hidden');document.getElementById('assetPage').classList.remove('hidden');
      document.getElementById('assetPage').innerHTML=`<div class="workspace"><div class="type-tabs"><button>规则标签</button><button class="active">结果标签</button></div><div class="asset-note">结果标签只能在 SOP 等业务任务中创建，并根据任务执行结果自动更新；本页面用于统一查看和管理。</div><div class="filter-card" style="margin-top:12px"><div class="asset-tabs"><button class="active">全部</button><button>我创建的</button></div><div class="filters" style="grid-template-columns:1.2fr 1fr 1fr auto"><input class="field" placeholder="请输入标签名称"><select class="field"><option>全部标签分组</option></select><select class="field"><option>全部状态</option></select><div><button class="btn primary">搜索</button><button class="btn">重置</button></div></div></div><div class="asset-bar"><strong>结果标签列表</strong><span class="hint">共 ${tags.length} 个结果标签</span></div><table class="asset-table"><thead><tr><th>标签名称</th><th>标签类型</th><th>标签描述</th><th>覆盖人数</th><th>创建人</th><th>最近操作时间</th><th>数据更新时间</th><th>状态</th><th>操作</th></tr></thead><tbody>${tags.map((t,i)=>`<tr><td><strong>${t.name}</strong></td><td><span class="badge result">结果标签</span></td><td title="${t.desc}">${t.desc}</td><td>${t.count.toLocaleString()}</td><td>${t.creator}</td><td>${t.opTime}</td><td>${t.dataTime}</td><td><span class="badge ${t.state==='启用'?'running':'stopped'}">${t.state}</span></td><td class="actions"><button class="detail" data-i="${i}">详情</button><button class="toggle-state ${t.state==='启用'?'danger':''}" data-i="${i}">${t.state==='启用'?'禁用':'启用'}</button></td></tr>`).join('')}</tbody></table><div class="pagination"><span>共 ${tags.length} 条</span><span>‹</span><span class="page-num">1</span><span>›</span><span>20 条/页⌄</span></div></div>`;
      document.querySelectorAll('.detail').forEach(x=>x.onclick=()=>renderAssetDetail(tags[+x.dataset.i]));document.querySelectorAll('.toggle-state').forEach(x=>x.onclick=()=>{const t=tags[+x.dataset.i];if(t.state==='启用'&&t.activeTask>0)return openDisableBlocked(t.activeTask);t.state=t.state==='启用'?'禁用':'启用';t.opTime=formatNow();renderAssets();toast(`已${t.state}结果标签`) });
    }
    function openTagPicker(){
      layer.innerHTML=`<div class="modal-mask"><div class="modal"><div class="modal-head">选择结果标签<button class="x close">×</button></div><div class="modal-body"><div class="searchline"><input placeholder="搜索标签名称"><button class="btn primary">搜索</button><button class="btn ghost-blue" id="modalNew">＋ 新建结果标签</button></div><div class="pick-list">${tags.map((t,i)=>`<div class="pick-row ${selectedTag&&selectedTag.name===t.name?'selected':''}" data-i="${i}"><span class="fake-radio"></span><div><div class="name">${t.name}</div><div class="small">${t.desc}</div></div><div class="small">覆盖 ${t.count.toLocaleString()} 人</div><div class="small">${t.task} 个任务使用</div></div>`).join('')}</div></div><div class="modal-foot"><button class="btn close">取消</button><button class="btn primary" id="confirmPick">确定</button></div></div></div>`;
      let temp=selectedTag;layer.querySelectorAll('.pick-row').forEach(r=>r.onclick=()=>{temp=tags[+r.dataset.i];layer.querySelectorAll('.pick-row').forEach(x=>x.classList.toggle('selected',x===r))});layer.querySelectorAll('.close').forEach(x=>x.onclick=closeLayer);document.getElementById('modalNew').onclick=()=>openCreateTag(true);document.getElementById('confirmPick').onclick=()=>{if(!temp)return toast('请选择结果标签');selectedTag=temp;closeLayer();renderSop();toast('已选择结果标签')};
    }
    function openCreateTag(fromSop){layer.innerHTML=`<div class="modal-mask"><div class="modal sm"><div class="modal-head">创建结果标签<button class="x close">×</button></div><div class="modal-body"><div class="form-block"><label><span style="color:red">*</span> 标签名称</label><input id="tagName" maxlength="30" placeholder="请输入结果标签名称"></div><div class="form-block"><label><span style="color:red">*</span> 标签分组</label><select><option>营销运营专用标签</option><option>SOP结果标签</option></select></div><div class="form-block"><label>标签描述</label><textarea placeholder="请输入"></textarea></div><div class="notice" style="font-size:12px">创建后将进入标签管理，可被其他任务选择。</div></div><div class="modal-foot"><button class="btn close">取消</button><button class="btn primary" id="saveTag">创建并选择</button></div></div></div>`;layer.querySelectorAll('.close').forEach(x=>x.onclick=closeLayer);document.getElementById('saveTag').onclick=()=>{const name=document.getElementById('tagName').value.trim();if(!name)return toast('请输入标签名称');const t={name,desc:'新建的任务结果标签',group:'SOP结果标签',count:0,task:1,creator:'单世权',createTime:'刚刚',opTime:'刚刚',dataTime:'-',state:'启用'};tags.unshift(t);selectedTag=t;closeLayer();renderSop();toast('结果标签创建成功')};}
    function renderAssetDetail(t){
      document.getElementById('crumb').innerHTML='首页　/　用户画像　/　标签中心　/　标签列表　/　<strong>结果标签详情</strong>';
      document.getElementById('assetPage').innerHTML=`<div class="workspace"><div class="detail-page-head"><button class="back-link" id="backToAssets">‹ 返回结果标签列表</button><span class="detail-title">${t.name}</span><span class="badge ${t.state==='启用'?'running':'stopped'}">${t.state}</span></div>
        <div class="detail-section"><div class="detail-section-title">基础信息</div><div class="detail-section-body"><div class="info-grid"><span class="key">标签名称</span><strong>${t.name}</strong><span class="key">标签类型</span><span><span class="badge result">结果标签</span></span><span class="key">标签分组</span><span>${t.group}</span><span class="key">标签状态</span><span>${t.state}</span><span class="key">标签描述</span><span>${t.desc}</span><span class="key">覆盖人数</span><span>${t.count.toLocaleString()} 人</span><span class="key">创建人</span><span>${t.creator}</span><span class="key">创建时间</span><span>${t.createTime}</span><span class="key">最近操作时间</span><span>${t.opTime}</span><span class="key">数据更新时间</span><span>${t.dataTime}</span></div></div></div>
        <div class="detail-section"><div class="detail-section-title">关联任务</div><div class="detail-section-body"><table class="detail-table"><tr><th>任务名称</th><th>任务类型</th><th>任务状态</th></tr><tr><td>客户预约提醒SOP</td><td>私聊SOP</td><td><span class="badge running">进行中</span></td></tr><tr><td>老客回访SOP</td><td>私聊SOP</td><td><span class="badge stopped">已结束</span></td></tr><tr><td>新客首咨跟进SOP</td><td>私聊SOP</td><td><span class="badge running">进行中</span></td></tr></table></div></div>
        <div class="detail-section"><div class="detail-section-title">覆盖人群明细</div><div class="detail-section-body"><div class="detail-filter"><input placeholder="请输入客户微信昵称"><input placeholder="请输入 UnionID"><input placeholder="请选择最新打标时间"><div><button class="btn primary">搜索</button><button class="btn">重置</button></div></div><table class="detail-table"><tr><th>客户微信昵称</th><th>UnionID</th><th>最新打标时间</th><th>来源任务数</th></tr><tr><td>张晓琳</td><td>oW8x_76f29a1c8e5d2</td><td>2026-08-29 14:18:25</td><td><span class="source-count">2 个</span></td></tr><tr><td>李明远</td><td>oW8x_31b04d8a7f9c6</td><td>2026-08-24 16:05:41</td><td><span class="source-count">1 个</span></td></tr><tr><td>周雨欣</td><td>oW8x_95e72c3b4a1f8</td><td>2026-08-30 11:26:09</td><td><span class="source-count">2 个</span></td></tr></table><div class="pagination"><span>共 ${t.count.toLocaleString()} 人</span><span>‹</span><span class="page-num">1</span><span>2</span><span>3</span><span>›</span></div></div></div></div>`;
      document.getElementById('backToAssets').onclick=renderAssets;document.querySelectorAll('.source-count').forEach(x=>x.onclick=()=>openSourceTasks());
    }
    function openSourceTasks(){layer.innerHTML=`<div class="modal-mask"><div class="modal sm"><div class="modal-head">来源任务<button class="x close">×</button></div><div class="modal-body"><table class="modal-table"><tr><th>任务名称</th><th>任务类型</th><th>任务状态</th></tr><tr><td>客户预约提醒SOP</td><td>私聊SOP</td><td>进行中</td></tr><tr><td>老客回访SOP</td><td>私聊SOP</td><td>已结束</td></tr></table></div><div class="modal-foot"><button class="btn primary close">关闭</button></div></div></div>`;layer.querySelectorAll('.close').forEach(x=>x.onclick=closeLayer)}
    function openDisableBlocked(taskCount){layer.innerHTML=`<div class="modal-mask"><div class="modal sm"><div class="modal-head">无法禁用<button class="x close">×</button></div><div class="modal-body"><div style="padding:12px 0 6px;line-height:24px">当前结果标签正在 ${taskCount} 个任务使用，无法禁用！请先结束任务后再禁用。</div></div><div class="modal-foot"><button class="btn primary close">我知道了</button></div></div></div>`;layer.querySelectorAll('.close').forEach(x=>x.onclick=closeLayer)}
    function formatNow(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`}
    function closeLayer(){layer.innerHTML=''}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}
    document.getElementById('toSop').onclick=()=>{document.getElementById('toSop').classList.add('active');document.getElementById('toAsset').classList.remove('active');renderSop()};document.getElementById('toAsset').onclick=()=>{document.getElementById('toAsset').classList.add('active');document.getElementById('toSop').classList.remove('active');renderAssets()};
    renderSop();
  </script>
</body>
</html>
