<style>

:root {

}
*{box-sizing:border-box}
body{margin:0;color:var(--cdp-text);background:var(--cdp-page);font:var(--cdp-font)/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--cdp-primary);outline-offset:2px}
[hidden]{display:none!important}
.cdp-workspace{padding:16px;min-width:0}
.cdp-panel{background:white;padding:16px;min-width:0}
.cdp-split{display:grid;grid-template-columns:240px minmax(0,1fr);gap:12px}
.cdp-sidebar{background:white;border-right:1px solid var(--cdp-border)}
.cdp-nav-item{padding:12px 16px;color:var(--cdp-secondary)}
.cdp-nav-item.is-active{color:var(--cdp-primary);background:var(--cdp-field)}
.cdp-tabs{display:flex;gap:32px;border-bottom:1px solid var(--cdp-border);margin-bottom:16px}
.cdp-tab{position:relative;border:0;background:none;padding:0 0 12px;color:var(--cdp-secondary)}
.cdp-tab[aria-selected=true]{color:var(--cdp-primary);font-weight:500}

.cdp-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 24px;padding:0 0 16px;border-bottom:1px solid var(--cdp-border)}
.cdp-field{display:flex;gap:16px;align-items:center;min-width:0}

.cdp-button--primary{color:white;background:var(--cdp-primary);border-color:var(--cdp-primary)}

.cdp-container-head{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border-bottom:1px solid var(--cdp-border);flex-shrink:0}
.cdp-container-title{font-size:var(--cdp-title);font-weight:600;margin:0}
.cdp-close{border:0;background:none;color:var(--cdp-secondary);font-size:20px;line-height:24px;padding:0 4px}
.cdp-container-body{padding:16px;overflow:auto;min-height:0;flex:1}
.cdp-container-foot{display:flex;justify-content:flex-end;gap:12px;padding:16px;border-top:1px solid var(--cdp-border);flex-shrink:0;background:white}
.cdp-error{font-size:var(--cdp-small);color:var(--cdp-danger);margin-top:4px}
.cdp-help{font-size:var(--cdp-small);color:var(--cdp-muted)}
.cdp-control[aria-invalid=true]{border-color:var(--cdp-danger)}
.cdp-empty{padding:48px 16px;text-align:center;color:var(--cdp-muted)}
.cdp-tag{display:inline-block;font-size:12px;padding:2px 8px;color:var(--cdp-primary);background:var(--cdp-primary-soft);border-radius:2px}

:root{color-scheme:light}

.static-option{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}.radio-dot{display:inline-block;width:14px;height:14px;border:1px solid #d8dce4;border-radius:50%;flex-shrink:0}.radio-dot.on{border:4px solid var(--cdp-primary)}

function validUnique(ids){const seen=new Set();return [...new Set(ids)].filter(id=>{const e=byId.get(id);if(!e?.active||seen.has(e.accountId))return false;seen.add(e.accountId);return true;});}
function captureCityAccounts(model,previous={}){

  ...model.employeeIds.filter(id=>byId.get(id)?.city===city)
 ])]));
}

async function refreshCities(){
 const d=state.draft;
 if(!d||!['copy','editDraft'].includes(d.mode)||!d.cityIds.length||state.refreshing)return;
 const version=++state.refreshVersion;
 const accountKey=id=>byId.get(id)?.accountId||'missing:'+id;
 const before=new Set(d.employeeIds.map(accountKey));
 state.refreshing=true;d.feedback=[];state.newlyAdded.clear();clearTimeout(state.toastTimer);$('toast').hidden=true;renderAccountArea();
 await new Promise(resolve=>setTimeout(resolve,650));
 if(state.draft!==d||version!==state.refreshVersion)return;
 let queried;
 try{queried=d.cityIds.flatMap(queryCityAccounts);}
 catch{
  d.feedback=['刷新失败，请重新操作'];state.refreshing=false;renderAccountArea();return;
 }
 const latest=new Set(queried.map(accountKey));
 const cityAccounts=captureCityAccounts(d,d.cityAccounts);
 const managed=new Set(Object.values(cityAccounts).flat().map(accountKey));
 const retained=d.employeeIds.filter(id=>!managed.has(accountKey(id))||latest.has(accountKey(id)));
 const combined=validUnique([...retained,...queried]);
 const after=new Set(combined.map(accountKey));
 const changed=before.size!==after.size||[...before].some(id=>!after.has(id));
 const added=combined.filter(id=>!before.has(accountKey(id)));
 const removed=[...before].filter(id=>!after.has(id));
 if(changed&&state.entry==='moments'&&d.customerTags.length){d.customerTags=[];}
 if(changed&&state.entry==='sop'){
  for(const kind of ['include','exclude']){
   if(d[kind+'Mode']==='tag'&&d[kind+'Items'].length){d[kind+'Items']=[];}
  }
 }
 d.employeeIds=combined;d.cityAccounts=captureCityAccounts(d);d.accountsExpanded=true;state.newlyAdded=new Set(added);
 const changes=[];
 if(added.length)changes.push(`本次新增${added.length}个账号`);
 if(removed.length)changes.push(`本次移除${removed.length}个账号`);
 d.feedback=changes;state.refreshing=false;
 renderAccountArea();
 if(state.entry==='moments')renderCustomerTags();
 if(state.entry==='sop')renderSopFilters();
}

 let source=null;
 if(mode==='copy'){const id={moments:'mom1',sop:'sop1',tag:'tag1'}[entry];source=records[entry].find(r=>r.id===id);}
 if(mode==='editDraft'){const id={moments:'momDraft',sop:'sop2'}[entry];source=records[entry].find(r=>r.id===id)||records[entry].find(r=>r.status==='草稿');}
 openDraft(source,mode);renderPrototypeSwitcher();
}
document.querySelectorAll('[data-prototype-entry]').forEach(b=>b.onclick=()=>launchPrototype(b.dataset.prototypeEntry,state.draft?.mode||state.lastPrototypeMode));
document.querySelectorAll('[data-prototype-mode]').forEach(b=>b.onclick=()=>launchPrototype(state.entry,b.dataset.prototypeMode));

$('close-task').onclick=closeDraft;$('close-selector').onclick=closeSelector;$('cancel-selector').onclick=closeSelector;$('confirm-selector').onclick=confirmSelector;
$('clear-selected').onclick=()=>{if(!state.selector)return;state.selector.employeeIds=[];state.selector.cityIds=[];state.selector.cityAccounts={};renderSelector();};
$('account-search').oninput=e=>{const s=state.selector;if(s){if(s.search.trim().toLowerCase()!==e.target.value.trim().toLowerCase())s.searchExpanded.clear();s.search=e.target.value;renderTree();$('account-tree').scrollTop=0;}};
document.querySelectorAll('[data-selector-tab]').forEach(b=>b.onclick=()=>{if(!state.selector)return;state.selector.tab=b.dataset.selectorTab;state.selector.search='';state.selector.searchExpanded.clear();$('account-search').value='';renderSelector();$('account-tree').scrollTop=0;});
document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{state.entry=b.dataset.entry;state.filter='';renderShell();});

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(state.selector)closeSelector();else if(state.draft)closeDraft();}
 if(e.key==='Tab'&&(state.selector||state.draft)){
  const dialog=state.selector?$('selector-drawer'):$('task-drawer');
  const focusables=[...dialog.querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex="0"]'),...$('prototype-controls').querySelectorAll('button:not(:disabled)')].filter(el=>el.getClientRects().length);
  const first=focusables[0],last=focusables[focusables.length-1];
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
 }
});
renderShell();openDraft();
</script>
</body></html>
